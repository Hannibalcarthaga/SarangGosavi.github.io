
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Publications | Sarang Gosavi</title>

  <style>
    :root {
      --navy: #18324c;
      --blue: #2868a5;
      --text: #344054;
      --muted: #667085;
      --line: #e5eaf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: white;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      color: var(--text);
      line-height: 1.65;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 28px;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--line);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
    }

    nav a:hover {
      color: var(--blue);
    }

    main {
      min-height: calc(100vh - 165px);
      padding-top: 65px;
      padding-bottom: 80px;
    }

    h1 {
      color: var(--navy);
      font-size: 35px;
      margin: 0 0 20px;
    }

    .message {
      font-size: 20px;
      color: var(--muted);
      margin-top: 35px;
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      nav {
        gap: 12px;
      }

      main {
        padding-top: 40px;
      }

      .container {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container navbar">

      <a href="index.html" class="logo">
        Sarang Gosavi
      </a>

      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="research.html">Research Projects</a>
        <a href="publications.html">Publications</a>
        <a href="awards.html">Awards & Honors</a>
        <a href="cv.html">CV</a>
      </nav>

    </div>
  </header>

  <main class="container">

    <h1>Publications</h1>

    <p class="message">
      Results are brewing. Publications coming soon!
    </p>

  </main>

  <footer>
    © 2026 Sarang Gosavi
  </footer>

</body>
</html>
